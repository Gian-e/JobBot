name: Daily JobBot Scrape & iPhone Push (11h & 23h)

on:
  schedule:
    # Executa 2x por dia: às 11:00 e às 23:00 (Horário de Brasília / 14:00 e 02:00 UTC)
    - cron: '0 2,14 * * *'
  workflow_dispatch:

jobs:
  trigger-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up server & run scheduled scraper (11h / 23h)
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Defina a secret APP_URL no GitHub (ex: https://jobbot-gian.onrender.com)"
            exit 1
          fi
          CLEAN_URL="${APP_URL%/}"
          echo "Acordando servidor em $CLEAN_URL/api/health ..."
          curl -sS --retry 5 --retry-delay 10 --max-time 90 "$CLEAN_URL/api/health" || true
          echo ""
          echo "Disparando busca (11h/23h) e Web Push com contagem de novas vagas em $CLEAN_URL/api/jobs/scrape ..."
          curl -sS -X POST --max-time 120 "$CLEAN_URL/api/jobs/scrape"
          echo ""
